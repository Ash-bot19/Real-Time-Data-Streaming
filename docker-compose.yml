services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    container_name: zookeeper
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks: [ confluent ]

  broker:
    image: confluentinc/cp-server:7.4.0
    container_name: broker
    depends_on: [ zookeeper ]
    ports:
      - "9092:9092"
      - "9101:9101"
      - "7071:7071"
    volumes:
      - kafka-data:/var/lib/kafka/data
      - ./monitoring:/monitoring
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://broker:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_JMX_OPTS: "-javaagent:/monitoring/jmx_prometheus_javaagent.jar=7071:/monitoring/kafka-jmx.yml"
    networks: [ confluent ]

  schema-registry:
    image: confluentinc/cp-schema-registry:7.4.0
    container_name: schema-registry
    depends_on: [ broker ]
    ports:
      - "8081:8081"
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: broker:29092
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
    networks: [ confluent ]

  control-center:
    image: confluentinc/cp-enterprise-control-center:7.4.0
    container_name: control-center
    depends_on: [ broker, schema-registry ]
    ports:
      - "9021:9021"
    environment:
      CONTROL_CENTER_BOOTSTRAP_SERVERS: broker:29092
      CONTROL_CENTER_SCHEMA_REGISTRY_URL: http://schema-registry:8081
      CONTROL_CENTER_REPLICATION_FACTOR: 1
      PORT: 9021
    networks: [ confluent ]

  cassandra_db:
    image: cassandra:3.11
    container_name: cassandra
    hostname: cassandra
    ports:
      - "9042:9042"
      - "9500:9500"
    volumes:
      - cassandra-data:/var/lib/cassandra
      - ./monitoring:/monitoring
    environment:
      MAX_HEAP_SIZE: 512M
      HEAP_NEWSIZE: 100M
      JVM_EXTRA_OPTS: "-javaagent:/monitoring/jmx_prometheus_javaagent.jar=9500:/monitoring/cassandra-jmx.yml"
    networks: [ confluent ]

  spark-master:
    build: ./spark
    container_name: spark-master
    environment:
      SPARK_MODE: master
      SPARK_MASTER_PORT: 7077
      SPARK_MASTER_WEBUI_PORT: 8080
      SPARK_MASTER_OPTS: "-javaagent:/monitoring/jmx_prometheus_javaagent.jar=8090:/monitoring/jmx-config.yml"
    command: [ "/opt/spark/bin/spark-class", "org.apache.spark.deploy.master.Master" ]
    ports:
      - "7077:7077"
      - "8085:8080"
      - "8090:8090"
    user: root
    volumes:
      - ./spark:/opt/spark/work
      - ./monitoring:/monitoring
      - ./spark/metrics.properties:/opt/spark/conf/metrics.properties
      - spark-checkpoints:/tmp/checkpoints
    networks: [ confluent ]

  spark-worker:
    build: ./spark
    container_name: spark-worker
    depends_on:
      - spark-master
    environment:
      SPARK_MODE: worker
      SPARK_WORKER_CORES: 2
      SPARK_WORKER_MEMORY: 1G
      SPARK_WORKER_OPTS: "-javaagent:/monitoring/jmx_prometheus_javaagent.jar=8091:/monitoring/jmx-config.yml"
    command: [ "/opt/spark/bin/spark-class", "org.apache.spark.deploy.worker.Worker", "spark://spark-master:7077" ]
    ports:
      - "8091:8091"
    user: root
    volumes:
      - ./spark:/opt/spark/work
      - ./monitoring:/monitoring
      - ./spark/metrics.properties:/opt/spark/conf/metrics.properties
    networks: [ confluent ]

  airflow-init:
    image: apache/airflow:2.7.3
    container_name: airflow-init
    entrypoint: /bin/bash
    command: -c "airflow db migrate && exit 0"
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: sqlite:////opt/airflow/db/airflow.db
    volumes:
      - ./dags:/opt/airflow/dags
      - ./airflow_logs:/opt/airflow/logs
      - ./airflow_db:/opt/airflow/db
    networks:
      - confluent

  airflow-scheduler:
    image: apache/airflow:2.7.3
    container_name: airflow-scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment:
      AIRFLOW__CORE__EXECUTOR: SequentialExecutor
      AIRFLOW__CORE__FERNET_KEY: something-random-12345
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: sqlite:////opt/airflow/db/airflow.db
    command: >
      bash -c "pip install --no-cache-dir -r /opt/airflow/requirements.txt &&
               exec airflow scheduler"
    volumes:
      - ./dags:/opt/airflow/dags
      - ./airflow_logs:/opt/airflow/logs
      - ./airflow_db:/opt/airflow/db
      - ./requirements.txt:/opt/airflow/requirements.txt:ro
    networks:
      - confluent

  airflow-webserver:
    image: apache/airflow:2.7.3
    container_name: airflow-webserver
    depends_on:
      airflow-scheduler:
        condition: service_started
    environment:
      AIRFLOW__CORE__EXECUTOR: SequentialExecutor
      AIRFLOW__CORE__FERNET_KEY: something-random-12345
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: sqlite:////opt/airflow/db/airflow.db
    command: >
      bash -c "pip install --no-cache-dir -r /opt/airflow/requirements.txt &&
               exec airflow webserver"
    ports:
      - "8080:8080"
    volumes:
      - ./dags:/opt/airflow/dags
      - ./airflow_logs:/opt/airflow/logs
      - ./airflow_db:/opt/airflow/db
      - ./requirements.txt:/opt/airflow/requirements.txt:ro
    networks:
      - confluent

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus:/etc/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
    networks: [ confluent ]

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
    networks:
      - confluent
    depends_on:
      - prometheus

  analytics:
    build: ./analytics
    container_name: analytics
    ports:
      - "8501:8501"
    networks:
      - confluent
    depends_on:
      - prometheus

  stress-producer:
    image: python:3.11
    container_name: stress-producer
    volumes:
      - ./:/app
    working_dir: /app
    command: sleep infinity
    networks:
      - confluent

networks:
  confluent:
    driver: bridge

volumes:
  kafka-data:
  cassandra-data:
  grafana-data:
  spark-checkpoints:
