global:
  scrape_interval: 5s

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["prometheus:9090"]

  - job_name: "spark-master"
    static_configs:
      - targets: ["spark-master:8090"]

  - job_name: "spark-worker"
    static_configs:
      - targets: ["spark-worker:8091"]

  - job_name: "kafka"
    static_configs:
      - targets: ["broker:7071"]

  - job_name: "cassandra"
    static_configs:
      - targets: ["cassandra:9500"]